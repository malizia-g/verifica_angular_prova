# Pubblica apps-script/Codice.gs su Google a ogni modifica, mantenendo lo stesso URL /exec.
# Configurazione (una volta sola), in Settings → Secrets and variables → Actions:
#   secret   CLASPRC_JSON   contenuto di ~/.clasprc.json dopo "clasp login --no-localhost"
#   variable SCRIPT_ID      Apps Script → Impostazioni progetto → ID script
#   variable DEPLOYMENT_ID  l'ID dell'app web (la parte tra /s/ e /exec dell'URL)
name: Pubblica Apps Script

on:
  push:
    branches: [main]
    paths: ["apps-script/**"]
  workflow_dispatch:

concurrency: apps-script

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Credenziali
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC" || { echo "Manca il secret CLASPRC_JSON"; exit 1; }
          test -n "${{ vars.SCRIPT_ID }}" || { echo "Manca la variabile SCRIPT_ID"; exit 1; }
          test -n "${{ vars.DEPLOYMENT_ID }}" || { echo "Manca la variabile DEPLOYMENT_ID"; exit 1; }
          printf '%s' "$CLASPRC" > ~/.clasprc.json

      - name: Prepara la cartella da caricare
        run: |
          # Il manifest (appsscript.json, con le impostazioni dell'app web) si prende dal progetto attuale,
          # così non sta nel repository e non si rischia di cambiarlo per sbaglio.
          mkdir -p /tmp/attuale /tmp/carica
          echo '{"scriptId":"${{ vars.SCRIPT_ID }}","rootDir":"."}' > /tmp/attuale/.clasp.json
          (cd /tmp/attuale && clasp pull)
          cp /tmp/attuale/appsscript.json /tmp/carica/
          cp apps-script/*.gs /tmp/carica/
          echo '{"scriptId":"${{ vars.SCRIPT_ID }}","rootDir":"."}' > /tmp/carica/.clasp.json
          ls -la /tmp/carica

      - name: Carica e pubblica una nuova versione (stesso URL)
        working-directory: /tmp/carica
        run: |
          clasp push --force
          clasp deploy --deploymentId "${{ vars.DEPLOYMENT_ID }}" --description "GitHub ${GITHUB_SHA::7}"
